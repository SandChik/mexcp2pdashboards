# Auto-deploy: every push to `main` syncs the code to the VPS over SSH and
# rebuilds + restarts the service there.
#
# Design note: the VPS never talks to GitHub (no deploy key / PAT stored on a
# server that holds exchange API keys). GitHub is the only side holding a
# credential: one dedicated SSH keypair for the low-privilege `deployer` user,
# whose sudo rights are limited to restarting this one service.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     public IP or hostname of the VPS
#   VPS_SSH_KEY  PRIVATE key for the `deployer` user (generated by setup-vps.sh)
#   VPS_PORT     (optional) SSH port, default 22

name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: deploy           # never run two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate: a deploy that would blank the dashboard must never reach the VPS.
      # `no-undef` alone catches the whole class of "a refactor deleted a
      # function that is still called" — the failure mode that shipped twice.
      - name: Lint + build (deploy is blocked if this fails)
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude '.git' \
            --exclude 'backend/data' \
            --exclude 'node_modules' \
            --exclude 'frontend/dist' \
            ./ deployer@${{ secrets.VPS_HOST }}:/opt/mexc-dashboard/
        # --delete keeps the server tree identical to the repo; the excludes
        # above are also PROTECTED from deletion (backend/data survives).

      - name: Build & restart on VPS
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" deployer@${{ secrets.VPS_HOST }} \
            'bash /opt/mexc-dashboard/deploy/remote-deploy.sh'
